name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY to remove all resources from the prod state"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Destroy Prod Infrastructure

    if: ${{ inputs.confirmation == 'DESTROY' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environments/prod

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Patch VNet Module IPAM Validation
        shell: bash
        run: |
          MODULE_FILE=".terraform/modules/virtual_network/variables.tf"

          if [ ! -f "$MODULE_FILE" ]; then
            echo "Module file not found: $MODULE_FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              ".terraform/modules/virtual_network/variables.tf"
          )

          old = (
              "condition     = var.ipam_pools == null || "
              "(length(var.ipam_pools) >= 1 && "
              "length(var.ipam_pools) <= 2)"
          )

          new = (
              "condition     = var.ipam_pools == null ? true : "
              "(length(var.ipam_pools) >= 1 && "
              "length(var.ipam_pools) <= 2)"
          )

          content = path.read_text()

          if old not in content:
              raise SystemExit(
                  "Expected ipam_pools validation was not found. "
                  "Check the VNet module version."
              )

          path.write_text(content.replace(old, new, 1))
          print(f"Patched successfully: {path}")
          PY

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

      - name: Terraform Destroy
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            destroy.tfplan