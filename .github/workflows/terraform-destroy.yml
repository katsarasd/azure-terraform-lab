name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY to remove all resources from the prod state"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Destroy Prod Infrastructure

    if: ${{ inputs.confirmation == 'DESTROY' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environments/prod

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Patch VNet module IPAM validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              ".terraform/modules/virtual_network/variables.tf"
          )

          old = (
              "condition     = var.ipam_pools == null || "
              "(length(var.ipam_pools) >= 1 && "
              "length(var.ipam_pools) <= 2)"
          )

          new = (
              "condition     = var.ipam_pools == null ? true : "
              "(length(var.ipam_pools) >= 1 && "
              "length(var.ipam_pools) <= 2)"
          )

          if not path.exists():
              raise SystemExit(
                  f"Virtual Network module file not found: {path}"
              )

          content = path.read_text(encoding="utf-8")

          if old not in content:
              raise SystemExit(
                  "Expected ipam_pools validation was not found. "
                  "The Virtual Network module version may have changed."
              )

          path.write_text(
              content.replace(old, new, 1),
              encoding="utf-8"
          )

          if new not in path.read_text(encoding="utf-8"):
              raise SystemExit(
                  "The ipam_pools validation patch was not applied."
              )

          print(f"Successfully patched: {path}")
          PY

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -out=destroy.tfplan

      - name: Show Destroy Plan
        run: terraform show -no-color destroy.tfplan

      - name: Terraform Destroy
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -lock-timeout=5m \
            destroy.tfplan