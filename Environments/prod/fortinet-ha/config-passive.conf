--==AZURE==
Content-Type: text/x-shellscript; charset="us-ascii"
MIME-Version: 1.0

config system global
    set hostname ${firewallname2}
    set admin-sport ${adminsport}
    set gui-auto-upgrade-setup-warning disable
    set timezone 26
end

config system probe-response
    set port 8008
    set http-probe-value ok
    set mode http-probe
end

config system interface
    edit "port1"
        set alias "external"
        set mode static
        set ip ${port1_ip} ${port1_mask}
        set allowaccess ping https ssh fgfm probe-response
    next

    edit "port2"
        set alias "internal"
        set mode static
        set ip ${port2_ip} ${port2_mask}
        set allowaccess ping https ssh fgfm probe-response
    next

    edit "port3"
        set alias "mgmt"
        set mode static
        set ip ${port3_ip} ${port3_mask}
        set allowaccess ping https ssh fgfm
    next

    edit "port4"
        set alias "ha"
        set mode static
        set ip ${port4_ip} ${port4_mask}
        set allowaccess ping
    next
end

config system ha
    set group-name "Azure-HA"
    set mode a-p
    set hbdev "port4" 100
    set session-pickup enable
    set hb-interval 20
    set hb-lost-threshold 60
    set ha-mgmt-status enable

    config ha-mgmt-interfaces
        edit 1
            set interface "port3"
            set gateway ${mgmt_gateway_ip}
        next
    end

    set override disable
    set priority 1
    set password "ftnt123456"
    set unicast-hb enable
    set unicast-hb-peerip ${active_peerip}
end

config router static
    edit 1
        set device "port1"
        set gateway ${defaultgwy}
    next

    edit 2
        set dst 168.63.129.16 255.255.255.255
        set gateway ${port1gateway}
        set device "port1"
    next

    edit 3
        set dst 168.63.129.16 255.255.255.255
        set gateway ${port2gateway}
        set device "port2"
    next
end

--==AZURE==--
